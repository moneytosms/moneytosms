name: update profile stats

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/pinned.json"
      - ".github/scripts/update_profile.py"

# Both this and the blog workflow commit to main; run one at a time.
concurrency:
  group: profile-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: regenerate stat cards and pinned table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 -I .github/scripts/update_profile.py

      - name: commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile stats and pinned table"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
